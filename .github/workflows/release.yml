# Builds the disk image people install Voiced from. docs/releasing.md is the guide for people.
#
#   A version tag (v1.2.3)  builds the DMG and attaches it to the GitHub Release of that tag.
#   A manual run            builds the DMG and keeps it as a workflow artifact. Nothing is published.
#
# With the five signing secrets set, the DMG is signed with a Developer ID, notarized and
# stapled. With none set it is signed ad hoc and named Voiced-<version>-unsigned.dmg.

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

# Naming the shell makes a step fail when any command in a pipe fails.
defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dmg:
    name: Build the DMG
    # macos-26 is GitHub's arm64 macOS 26 image. It carries every Xcode 26 release; 26.2 is the
    # oldest Xcode the project supports and the one the app is tried with, so a release is built
    # with it. On a private repository a minute on this runner is billed as ten.
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    outputs:
      file: ${{ steps.package.outputs.file }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show the toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      # The tag is the version: v1.2.3 makes Voiced 1.2.3. A manual run keeps the project's own.
      - name: Read the version from the tag
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ] && [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "Version ${REF_NAME#v}, from the tag."
          else
            echo "No version tag: the project's own version is used."
          fi

      # Secrets cannot be read in an `if:`, so this step says which kind of run this is. It
      # tests only whether each secret is empty and prints names, never a value.
      - name: Decide how to sign
        id: signing
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          present=""
          missing=""
          for name in DEVELOPER_ID_P12_BASE64 DEVELOPER_ID_P12_PASSWORD NOTARY_KEY_P8_BASE64 NOTARY_KEY_ID NOTARY_ISSUER_ID; do
            if [ -n "${!name}" ]; then present="$present $name"; else missing="$missing $name"; fi
          done
          if [ -z "$present" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No signing secrets are set. This run makes an ad hoc signed DMG, named -unsigned, that macOS will not open without the person's approval."
          elif [ -z "$missing" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "All five signing secrets are set: this run signs, notarizes and staples."
          else
            echo "::error::Some signing secrets are set and others are not. Missing:$missing. Add them, or remove the others to build unsigned. See docs/releasing.md."
            exit 1
          fi

      # The certificate goes into a keychain that exists for this job only. The team ID, which
      # macOS writes after the name on the certificate, is masked before anything can print it.
      - name: Set up signing
        id: setup
        if: steps.signing.outputs.signed == 'true'
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: |
          umask 077
          keychain="$RUNNER_TEMP/voiced-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          certificate="$RUNNER_TEMP/developer-id.p12"
          notary_key="$RUNNER_TEMP/notary-key.p8"

          printf '%s' "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          if ! security import "$certificate" -P "$DEVELOPER_ID_P12_PASSWORD" -f pkcs12 -k "$keychain" -T /usr/bin/codesign > /dev/null; then
            echo "::error::The certificate could not be imported. DEVELOPER_ID_P12_BASE64 must be the base64 of a .p12 exported from Keychain Access, and DEVELOPER_ID_P12_PASSWORD the password given at that export."
            exit 1
          fi
          rm -f "$certificate"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | sed 's/"//g')

          identity="$(security find-identity -v -p codesigning "$keychain" | grep 'Developer ID Application' | head -1 || true)"
          if [ -z "$identity" ]; then
            echo "::error::DEVELOPER_ID_P12_BASE64 holds no Developer ID Application certificate together with its private key. An Apple Development certificate, or a certificate exported without its key, cannot sign a release."
            exit 1
          fi
          team="$(printf '%s' "$identity" | sed -nE 's/.*\(([A-Z0-9]{10})\)".*/\1/p')"
          if [ -n "$team" ]; then echo "::add-mask::$team"; fi
          echo "identity=$(printf '%s' "$identity" | awk '{ print $2 }')" >> "$GITHUB_OUTPUT"

          printf '%s' "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$notary_key"
          if ! grep -q 'PRIVATE KEY' "$notary_key"; then
            echo "::error::NOTARY_KEY_P8_BASE64 does not decode to an App Store Connect API key. It must be the base64 of the AuthKey .p8 file."
            exit 1
          fi
          echo "notary_key=$notary_key" >> "$GITHUB_OUTPUT"
          echo "A Developer ID Application certificate and a notarization key are ready."

      - name: Build, sign, package and check
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          DEVELOPER_ID: ${{ steps.setup.outputs.identity }}
          NOTARY_KEY: ${{ steps.setup.outputs.notary_key }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          make dmg
          path="$(ls build/dmg/Voiced-*.dmg)"
          file="$(basename "$path")"
          if [[ "$file" == *-unsigned.dmg ]]; then named_signed=false; else named_signed=true; fi
          if [ "$named_signed" != "$SIGNED" ]; then
            echo "::error::The image's name, $file, does not say how this run signed it."
            exit 1
          fi
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "file=$file" >> "$GITHUB_OUTPUT"
          {
            echo "### $file"
            echo
            if [ "$SIGNED" = "true" ]; then
              echo "Signed with a Developer ID, notarized and stapled."
            else
              echo "**Not signed with a Developer ID and not notarized.** macOS will not open it until the person approves it, and each update has to be approved and given Accessibility again."
            fi
            echo
            echo "- Size: $(wc -c < "$path" | tr -d ' ') bytes"
            echo "- SHA-256: \`$(shasum -a 256 "$path" | cut -d ' ' -f 1)\`"
            echo "- Built with $(xcodebuild -version | tr '\n' ' ')on macOS $(sw_vers -productVersion)"
          } >> "$GITHUB_STEP_SUMMARY"

      # `archive: false` keeps the artifact as the DMG itself, not a zip around it.
      - name: Keep the DMG as a workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.package.outputs.path }}
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Remove the keychain and the key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/voiced-signing.keychain-db" 2> /dev/null || true
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/notary-key.p8"

  # This job runs for a manual run too, where it writes the release notes to the run's summary
  # and stops, so the steps a tag depends on are tried before a tag is pushed. Only its last
  # step publishes, and only for a version tag. It holds no signing secret.
  release:
    name: Release notes and GitHub Release
    needs: dmg
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      FILE: ${{ needs.dmg.outputs.file }}
    steps:
      - name: Fetch the DMG
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.dmg.outputs.file }}
          path: dist

      - name: Write the release notes
        run: |
          test -s "dist/$FILE"
          checksum="$(sha256sum "dist/$FILE" | cut -d ' ' -f 1)"
          if [[ "$FILE" == *-unsigned.dmg ]]; then
            cat > notes.md <<EOF
          ## Install

          **This build is not signed with an Apple Developer ID and not notarized by Apple, so macOS will not open it until you approve it yourself.**

          1. Download \`$FILE\` below, open it, and drag Voiced into Applications.
          2. Open Voiced from Applications. macOS says it could not verify the app. Click Done.
          3. Open System Settings › Privacy & Security, scroll down to Security, click Open Anyway beside Voiced, and confirm. The button shows for about an hour after macOS refused the app; open Voiced again if it is gone.
          4. Follow Voiced's setup window: allow the Microphone, switch Voiced on under Accessibility, and paste your Grok API key.

          If macOS says instead that Voiced is damaged, or there is no Open Anyway, run \`xattr -dr com.apple.quarantine /Applications/Voiced.app\` in Terminal and open Voiced again.

          **After every update** macOS takes the new build for a different app. Approve it again as in steps 2 and 3. Then, under System Settings › Privacy & Security › Accessibility, remove Voiced from the list and switch it on again; until you do, the hotkey does nothing. macOS may also ask for the Microphone again, and asks for your login password before Voiced can read the saved key.

          Needs macOS 26 or later, on Apple silicon or Intel.

          SHA-256: \`$checksum\`
          EOF
          else
            cat > notes.md <<EOF
          ## Install

          1. Download \`$FILE\` below, open it, and drag Voiced into Applications.
          2. Open Voiced from Applications.
          3. Follow Voiced's setup window: allow the Microphone, switch Voiced on under Accessibility, and paste your Grok API key.

          Signed with a Developer ID and notarized by Apple. Needs macOS 26 or later, on Apple silicon or Intel.

          SHA-256: \`$checksum\`
          EOF
          fi
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

      # A release that already exists for the tag, drafted by hand or left by an earlier run,
      # keeps its text and gets the DMG. Otherwise one is made, with the notes above and
      # the notes GitHub generates.
      - name: Publish the GitHub Release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "dist/$FILE" --clobber
          else
            gh release create "$TAG" "dist/$FILE" --verify-tag --title "Voiced ${TAG#v}" --notes-file notes.md --generate-notes
          fi
